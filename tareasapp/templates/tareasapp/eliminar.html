{% extends 'tareasapp/base.html' %}

{% block title %}Eliminar producto{% endblock %}

{% block content %}
<h1 class="mb-4">Eliminar producto</h1>
<div class="card">
    <div class="card-body">
        <p>¿Eliminar {{ producto.nombre }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'inicio' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
