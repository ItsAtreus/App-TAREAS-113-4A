<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Productos</title>
</head>
<body>
    <h1>Productos</h1>
    <p><a href="{% url 'crear_producto' %}">Crear producto</a></p>

    {% for producto in productos %}
        <article>
            <h2>{{ producto.nombre }}</h2>
            <p>{{ producto.descripcion }}</p>
            <p>Precio: ${{ producto.precio }} | Stock: {{ producto.stock }} | Categoría: {{ producto.categoria }}</p>
            <a href="{% url 'detalle_producto' producto.id %}">Ver</a>
            <a href="{% url 'editar_producto' producto.id %}">Editar</a>
            <a href="{% url 'eliminar_producto' producto.id %}">Eliminar</a>
        </article>
    {% empty %}
        <p>No hay productos registrados.</p>
    {% endfor %}
</body>
</html>
