<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{{ producto.nombre }}</title>
</head>
<body>
    <h1>{{ producto.nombre }}</h1>
    <p>{{ producto.descripcion }}</p>
    <p>Precio: ${{ producto.precio }}</p>
    <p>Stock: {{ producto.stock }}</p>
    <p>Categoría: {{ producto.categoria }}</p>
    <p><a href="{% url 'editar_producto' producto.id %}">Editar</a></p>
    <p><a href="{% url 'inicio' %}">Volver a productos</a></p>
</body>
</html>
